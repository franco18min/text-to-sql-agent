name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          # Provide dummy creds so config can load; tests don't actually call the API
          GOOGLE_API_KEY: dummy_for_tests
          DATABRICKS_HOST: dummy.cloud.databricks.com
          DATABRICKS_TOKEN: dummy
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/dummy
        run: |
          pytest tests/ -v --tb=short

      - name: Run pytest with coverage
        env:
          GOOGLE_API_KEY: dummy_for_tests
          DATABRICKS_HOST: dummy.cloud.databricks.com
          DATABRICKS_TOKEN: dummy
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/dummy
        run: |
          pytest tests/ --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  lint:
    name: ruff (optional, no-op if not installed)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check app/ tests/ scripts/ ui/
